<style>

:root{

    --primary:#1F4E79;
    --primary-light:#2E6DA4;
    --accent:#4CAF50;
    --danger:#D9534F;
    --warning:#F0AD4E;
    --background:#F5F7FA;
    --card:#FFFFFF;
    --border:#E5E7EB;
    --text:#1F2937;
    --muted:#6B7280;

    --radius:12px;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    font-family:'Inter',sans-serif;
    background:var(--background);
    color:var(--text);

}

#app{

    display:flex;
    min-height:100vh;

}

/************************************************
 Sidebar
************************************************/

.sidebar{

    width:270px;
    background:#17324D;
    color:white;
    display:flex;
    flex-direction:column;

}

.logo{

    padding:30px 24px;
    border-bottom:1px solid rgba(255,255,255,.08);

}

.logo-title{

    font-size:28px;
    font-weight:700;

}

.logo-subtitle{

    margin-top:8px;
    font-size:13px;
    line-height:18px;
    opacity:.75;

}

.menu{

    display:flex;
    flex-direction:column;
    padding:18px;

}

.menu-item{

    background:none;
    border:none;
    color:white;
    text-align:left;
    padding:14px 16px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:8px;
    font-size:15px;
    transition:.2s;

}

.menu-item:hover{

    background:rgba(255,255,255,.08);

}

.menu-item.active{

    background:var(--primary-light);

}

/************************************************
 Main
************************************************/

.main-content{

    flex:1;
    display:flex;
    flex-direction:column;

}

.topbar{

    background:white;
    padding:24px 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);

}

.subtitle{

    color:var(--muted);
    margin-top:6px;

}

.user-area{

    font-size:14px;
    color:var(--muted);

}

.page{

    padding:30px;

}

/************************************************
 Modules
************************************************/

.module-container{

    display:flex;

    flex-direction:column;

    gap:24px;

}

.module-header{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:8px;

}

.module-subtitle{

    margin-top:6px;

    font-size:14px;

    color:var(--muted);

    line-height:1.5;

    max-width:650px;

}

.module-actions{

    display:flex;

    align-items:end;

    gap:12px;

    flex-wrap:wrap;

}

.module-actions label{

    font-size:13px;

    font-weight:600;

    color:var(--muted);

}

.module-actions select{

    min-width:150px;

}

.secondary-btn{

    background:white;

    border:1px solid var(--border);

    color:var(--primary);

    padding:10px 16px;

    border-radius:10px;

    cursor:pointer;

    font-weight:600;

}

.secondary-btn:hover{

    background:#F8FAFC;

}

.secondary-btn:disabled{

    cursor:not-allowed;

    opacity:.6;

}
.hidden{

    display:none;

}

/************************************************
 Buttons
************************************************/

.primary-btn{

    background:var(--primary);
    color:white;
    border:none;
    padding:11px 22px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;

}

.primary-btn:hover{

    background:var(--primary-light);

}

/************************************************
 Cards
************************************************/

.card{

    background:white;
    border-radius:var(--radius);
    padding:24px;
    border:1px solid var(--border);

}

.card-title{

    font-size:18px;
    font-weight:600;
    margin-bottom:20px;

}

/************************************************
 Dashboard
************************************************/

.dashboard-container{

    display:flex;
    flex-direction:column;
    gap:25px;

}

.dashboard-header{

    display:flex;
    justify-content:space-between;
    align-items:center;

}

.dashboard-title{

    font-size:26px;
    font-weight:700;

}

.kpi-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;

}

.kpi-card{

    background:white;
    border-radius:12px;
    padding:24px;
    border:1px solid var(--border);

}

.kpi-value{

    font-size:34px;
    font-weight:700;

}

.kpi-label{

    margin-top:10px;
    color:var(--muted);

}

.dashboard-row{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;

}

.full-width{

    grid-column:1/-1;

}

canvas{

    width:100%!important;
    height:320px!important;

}

/************************************************
 Tables
************************************************/

.table{

    width:100%;
    border-collapse:collapse;
    table-layout:auto;

}

.table th{

    background:#F8FAFC;
    padding:14px;
    text-align:left;
    border-bottom:1px solid var(--border);
    white-space:nowrap;

}

.table td{

    padding:14px;
    border-bottom:1px solid var(--border);
    vertical-align:top;

}



/************************************************
 Forms
************************************************/

.form-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:22px;

}

.form-group{

    display:flex;
    flex-direction:column;

}

.form-group label{

    margin-bottom:8px;
    font-weight:600;

}

input,
select,
textarea{

    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-family:inherit;
    font-size:14px;

}

textarea{

    resize:vertical;

}

/************************************************
 Responsive
************************************************/

@media(max-width:1100px){

.dashboard-row{

grid-template-columns:1fr;

}

.sidebar{

width:220px;

}

}

@media(max-width:768px){

#app{

flex-direction:column;

}

.sidebar{

width:100%;

}

.topbar{

padding:20px;

}

.page{

padding:20px;

}

}

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:10000;

}

.confirm-modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:20000;

}

.hidden{

    display:none !important;

}

.preview-container{

    width:90%;

    max-width:1100px;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:12px;

    padding:24px;

    box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.evidence-file{

    display:block;
    white-space:nowrap;
    line-height:1.3;
    margin:0;
    padding:0;

}

.evidence-cell{

    vertical-align: top;
    padding-top: 14px;

}
</style>
