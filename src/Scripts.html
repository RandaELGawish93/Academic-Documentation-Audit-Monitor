<script>

let currentPage = "dashboard";

/************************************************
 Initialize
************************************************/

document.addEventListener("DOMContentLoaded", () => {

    loadUser();

});

/************************************************
 Navigation
************************************************/

function showPage(page){

    currentPage = page;

    document.querySelectorAll(".page").forEach(p=>{

        p.classList.add("hidden");

    });

    document.getElementById(page+"Page").classList.remove("hidden");

    document.querySelectorAll(".menu-item").forEach(btn=>{

        btn.classList.remove("active");

    });

    event.target.classList.add("active");

    const titles={

        dashboard:"Dashboard",

        settings:"Settings",

        users:"Users",
        
        mom:"Minutes of Meetings",

        subject:"Subject Screening",

        observation:"Teacher Observation",

        archive:"Archive"

    };

    document.getElementById("pageTitle").innerHTML=titles[page];

}

/************************************************
 User
************************************************/

function loadUser(){

    google.script.run

    .withSuccessHandler(function(user){

        document.getElementById("userName").innerHTML=user.email;

    })

    .getCurrentUser();

}

/************************************************
 Loading Overlay
************************************************/

function showLoading(){

    const overlay=document.createElement("div");

    overlay.id="loadingOverlay";

    overlay.innerHTML=`

        <div class="loading-box">

            <div class="spinner"></div>

            <div>Loading...</div>

        </div>

    `;

    document.body.appendChild(overlay);

}

function hideLoading(){

    const overlay=document.getElementById("loadingOverlay");

    if(overlay){

        overlay.remove();

    }

}


/************************************************
 Generic Confirmation
************************************************/

function confirmAction(message){

    return confirm(message);

}
function callServer(serverFunction, args = [], successHandler = null) {

    showLoading();

    let runner = google.script.run

        .withSuccessHandler(function(result){

            hideLoading();

            if(successHandler){

                successHandler(result);

            }

        })

        .withFailureHandler(function(err){

            hideLoading();

            error(err.message);

        });

    runner[serverFunction].apply(runner,args);

}

function runAudit(){

    callServer(

        "runMoMAudit",

        [],

        function(result){

            success(

            "Audit completed successfully.\n\n" +

            "Please review the Action Center before processing emails."

            );

            refreshMoM();

        }

    );

}
function refreshMoM(){

    callServer(

        "refreshMoMActionCenter",

        [],

        function(){

            success("MoM Action Center refreshed successfully.");

        }

    );

}

function archiveSystem(){

    error("Archive module not implemented yet.");

}

/************************************************
 Global Error Handler
************************************************/

window.onerror=function(message,source,line,column,error){

    console.error({

        message,

        source,

        line,

        column,

        error

    });

};

</script>

<style>

#loadingOverlay{

    position:fixed;

    inset:0;

    background:rgba(255,255,255,.7);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.loading-box{

    background:white;

    padding:30px;

    border-radius:12px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.spinner{

    width:40px;

    height:40px;

    margin:auto auto 15px;

    border:4px solid #ddd;

    border-top:4px solid #1F4E79;

    border-radius:50%;

    animation:spin .8s linear infinite;

}

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}

</style>
