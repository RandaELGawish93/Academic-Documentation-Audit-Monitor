<div class="settings-container">

    <div class="page-header">

        <h2>System Settings</h2>

        <button class="primary-btn" onclick="saveSettings()">
            Save Settings
        </button>

    </div>

    <!-- General Settings -->

    <div class="card">

        <div class="card-title">
            General
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>Academic Year</label>

                <input type="text"
                       id="academicYear"
                       placeholder="2026/2027">

            </div>

            <div class="form-group">

                <label>System Type</label>

                <select id="systemType">

                    <option>American</option>
                    <option>British</option>
                    <option>American & British</option>

                </select>

            </div>

            <div class="form-group">

                <label>Current Trimester</label>

                <select id="trimester">
                    <option>Induction Week</option>
                    <option>Trimester 1</option>
                    <option>Trimester 2</option>
                    <option>Trimester 3</option>

                </select>

            </div>

            <div class="form-group">

                <label>Current Week</label>

                <input type="number"
                       id="week"
                       min="1">

            </div>

            <div class="form-group">

                <label>Number of Weeks</label>

                <input type="number"
                       id="numberWeeks">

            </div>

            <div class="form-group">

                <label>Merged Weeks</label>

                <input type="text"
                       id="mergedWeeks"
                       placeholder="5,6">

            </div>

        </div>

    </div>

    
    <!-- Google Drive -->

    <div class="card">

        <div class="card-title">
            Directories
        </div>

            <div class="form-group">

                <label>Archive Root Folder</label>

                <input type="text"
                       id="archiveFolder"
                       placeholder="Google Drive Folder ID">
                <small style="color:#666;font-size:12px;">
                This folder stores archived reports, logs, and exported files generated by all ADAM modules.
                </small>
            </div>

        </div>

      </div>
<script>

document.addEventListener("DOMContentLoaded",function(){

    loadSettings();

});

function loadSettings(){

    google.script.run
        .withSuccessHandler(populateSettings)
        .getSettings();

}

function populateSettings(data){

    document.getElementById("academicYear").value=data["Academic Year"] || "";
    document.getElementById("systemType").value=data["System Type"] || "American";
    document.getElementById("trimester").value=data["Current Trimester"] || "Trimester 1";
    document.getElementById("week").value=data["Current Week"] || 1;
    document.getElementById("numberWeeks").value=data["Number Of Weeks"] || 36;
    document.getElementById("mergedWeeks").value=data["Merged Weeks"] || "";
    document.getElementById("archiveFolder").value=data["Archive Root Folder"] || "";

}

function saveSettings(){

    showLoading("Saving settings...");

    const settings={

        academicYear:

            document.getElementById("academicYear").value,

        systemType:

            document.getElementById("systemType").value,

        trimester:

            document.getElementById("trimester").value,

        week:

            document.getElementById("week").value,

        numberWeeks:

            document.getElementById("numberWeeks").value,

        mergedWeeks:

            document.getElementById("mergedWeeks").value,

        archiveFolder:

            document.getElementById("archiveFolder").value

    };

    google.script.run

    .withSuccessHandler(function(){

        hideLoading();

        success("Settings saved successfully.");

    })

    .withFailureHandler(function(err){

        hideLoading();

        error(err.message);

    })

    .saveSettings(settings);

}


</script>
