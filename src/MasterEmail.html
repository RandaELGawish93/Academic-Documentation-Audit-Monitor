<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{

    margin:0;
    padding:0;
    background:#f5f7fa;
    font-family:Arial,Helvetica,sans-serif;
    color:#333;

}

.wrapper{

    width:100%;
    padding:40px 0;

}

.container{

    width:700px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #E5E7EB;

}

.header{

    background:#1F4E79;
    color:white;
    padding:30px;

}

.header h1{

    margin:0;
    font-size:28px;

}

.header p{

    margin-top:8px;
    opacity:.9;

}

.content{

    padding:35px;

    line-height:1.7;

}

.footer{

    background:#F3F4F6;

    padding:20px;

    font-size:13px;

    color:#666;

    text-align:center;

}

.badge{

    display:inline-block;

    padding:8px 16px;

    border-radius:20px;

    font-weight:bold;

    color:white;

}

.green{

    background:#4CAF50;

}

.orange{

    background:#F0AD4E;

}

.yellow{

    background:#F1C232;

}

.red{

    background:#D9534F;

}

table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}

table td{

    padding:10px;

    border:1px solid #ddd;

}

.signature{

    margin-top:40px;

}

</style>

</head>

<body>

<div class="wrapper">

<div class="container">

<div class="header">

<h1><?= title ?></h1>

<p><?= subtitle ?></p>

</div>

<div class="content">

<?!= body ?>

<div class="signature">

Kind regards,

<br><br>

<b>Academic Dean Office</b>

</div>

</div>

<div class="footer">

This email was generated by

<b>ADAM 2.0</b>

Academic Documentation Audit Monitor

</div>

</div>

</div>

</body>

</html>
